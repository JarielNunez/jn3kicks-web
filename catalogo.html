<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Catálogo | JNS KICKS</title>

    <link rel="stylesheet" href="css/catalogo.css">
</head>

<body>

    <header class="encabezado">

        <nav class="navegacion">

            <h1 class="logo">JNS KICKS</h1>

            <ul class="menu">
                <li>
                    <a href="index.html">Inicio</a>
                </li>

                <li>
                    <a href="catalogo.html">Catálogo</a>
                </li>

                <li>
                    <a href="nosotros.html">Nosotros</a>
                </li>

                <li>
                    <a href="contacto.html">Contacto</a>
                </li>
            </ul>

        </nav>

    </header>

    
    <main class="contenido-principal">

        <!-- Título del catálogo -->
        <section class="encabezado-catalogo">

            <h2>Catálogo de Tenis</h2>

            <p>
                Encuentra los mejores tenis deportivos y urbanos
                en JNS KICKS.
            </p>

        </section>

        
        <section class="busqueda">

            <h2>Buscar productos</h2>

            <form action="#" method="get">

                <label for="buscar">Buscar tenis:</label>

                <input
                    type="search"
                    id="buscar"
                    name="buscar"
                    placeholder="Escribe el nombre del tenis"
                >

                <button type="submit">
                    Buscar
                </button>

            </form>

        </section>

        
        <section id="catalogo" class="seccion-catalogo">

            <h2>Productos</h2>

             <aside class="filtros">

                <h2>Filtros</h2>

                  <section class="filtro">

                    <h3>Marca</h3>

                    <ul>

                        <li>
                            <label>
                                <input
                                    type="checkbox"
                                    name="marca"
                                    value="nike"

                                      >
                                Nike
                            </label>
                        </li>

                        <li>
                            <label>
                                <input
                                    type="checkbox"
                                    name="marca"
                                    value="converse"
                                     >
                                Converse
                            </label>
                        </li>

                    </ul>

                </section>
             <section class="filtro">

                    <h3>Género</h3>

                    <ul>

                        <li>
                            <label>
                                <input
                                    type="checkbox"
                                    name="genero"
                                    value="hombre"
                                >
                                Hombre
                            </label>
                        </li>

                        <li>
                            <label>
                                <input
                                    type="checkbox"
                                    name="genero"
                                    value="mujer"
                                >
                                Mujer
                            </label>
                        </li>

                        <li>
                            <label>
                                <input
                                    type="checkbox"
                                    name="genero"
                                    value="unisex"
                                >
                                Unisex
                            </label>
                        </li>

                    </ul>

                </section>
                <section class="filtro">

                    <h3>Categoría</h3>

                    <ul>

                        <li>
                            <label>
                                <input
                                    type="checkbox"
                                    name="categoria"
                                    value="running"
                                >
                                Running
                            </label>
                        </li>

                        <li>
                            <label>
                                <input
                                    type="checkbox"
                                    name="categoria"
                                    value="basketball"
                                >
                                Basketball
                            </label>
                        </li>

                        <li>
                            <label>
                                <input
                                    type="checkbox"
                                    name="categoria"
                                    value="casual"
                                >
                                Casual
                            </label>
                        </li>

                    </ul>

                </section>

            </aside>
